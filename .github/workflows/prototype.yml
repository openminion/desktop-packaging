name: Prototype

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      TARGET: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: macos-arm64
          - runner: macos-15-intel
            target: macos-x64
          - runner: windows-2022
            target: windows-x64
          - runner: ubuntu-22.04
            target: linux-x64

    steps:
      - name: Check out packaging repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out exact Desktop source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openminion/desktop
          ref: 1867ca2d3703c29f3d8c8808b71f39b8c42215c0
          path: desktop-source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop-source/package-lock.json
      - name: Install exact npm
        run: npm install --global npm@11.12.1 # zizmor: ignore[adhoc-packages] Exact release toolchain pin.

      - name: Check packaging repository
        run: npm run check

      - name: Install Linux packaging tools
        if: matrix.target == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install --yes fakeroot

      - name: Build unsigned native prototype
        shell: bash
        run: node packaging/build.mjs build --source desktop-source --target "$TARGET"

      - name: Upload temporary artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openminion-desktop-${{ matrix.target }}
          path: dist/openminion-desktop-*-${{ matrix.target }}*
          if-no-files-found: error
          retention-days: 14
